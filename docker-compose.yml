services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mimiciv
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_LOADER_PASS:-change-me-admin}
      MIMIC_READER_PASSWORD: ${DB_PASS:-change-me-reader}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mimiciv"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
